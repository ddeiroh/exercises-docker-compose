services:
  backend:
    build:
      context: ../example-app
      dockerfile: ../example-app/Dockerfile.backend
    ports:
      - "8080:8080"
    environment: 
      REDIS_HOST: redis
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: example
      POSTGRES_DB: postgres
      POSTGRES_HOST: pgsql
    restart: unless-stopped
    depends_on: 
      - redis

  frontend:
    build:
      context: ../example-app
      dockerfile: ../example-app/Dockerfile.frontend
    ports:
      - "5001:5001"
    depends_on: 
      - backend

  postgres:
    image: postgres:18
    hostname: postgres
    container_name: pgsql
    volumes:
      - ./database:/var/lib/postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: example
      POSTGRES_DB: postgres
    restart: unless-stopped

  nginx:
    image: nginx:trixie
    ports: 
      - 8000:80
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - frontend
    restart: unless-stopped

  redis:
    image: redis:7.4.12-alpine
