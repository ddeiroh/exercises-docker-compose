services:
  backend:
    image: backend:latest
    build:
      context: ../example-app
      dockerfile: ../example-app/Dockerfile.backend
    ports:
      - "8080:8080"
    environment: 
      REDIS_HOST: redis
    restart: unless-stopped
    depends_on: 
      - redis

  frontend:
    image: frontend:latest
    build:
      context: ../example-app
      dockerfile: ../example-app/Dockerfile.frontend
    ports:
      - "5001:5001"
    depends_on: 
      - backend

  redis:
    image: redis:7.4.12-alpine
